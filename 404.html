<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esta pieza no encaja | ModuleX Dock</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1014">
<link rel="icon" href="/modulex-dock/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
:root{--azul:#0095DA;--tinta:#0B1014;--cafe:#645B57;--concreto:#E6E4D9;--agua:#98DFEA;--ease:cubic-bezier(.16,.8,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 16px;background:var(--tinta);color:var(--concreto);font:400 1.05rem/1.6 'Archivo',sans-serif;text-align:center}
.tablero{display:grid;grid-template-columns:repeat(4,clamp(44px,12vw,72px));gap:4px;margin:0 auto 40px;width:max-content;position:relative}
.tablero i{aspect-ratio:1;border-radius:16%;background:color-mix(in srgb,var(--tinta) 20%,var(--concreto))}
.tablero i.hueco{background:transparent;box-shadow:inset 0 0 0 2px var(--azul)}
.suelta{position:absolute;right:-38%;top:-30%;width:clamp(44px,12vw,72px);aspect-ratio:1;border-radius:16%;background:var(--cafe);transform:rotate(18deg)}
@media (prefers-reduced-motion:no-preference){.suelta{animation:flota 3.2s var(--ease) infinite alternate}}
@keyframes flota{to{transform:translate3d(0,-10px,0) rotate(24deg)}}
p.k{font:500 .78rem/1 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--agua)}
h1{margin:.3em 0 .4em;font-size:clamp(2.2rem,8vw,4.8rem);font-weight:800;font-stretch:115%;line-height:.95;letter-spacing:-.02em}
h1 b{color:var(--azul)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 1.5em;border-radius:999px;border:1.5px solid var(--azul);background:var(--azul);color:var(--tinta);font-weight:700;text-decoration:none;transition:transform .2s var(--ease)}
a.btn.g{background:transparent;color:var(--concreto);border-color:currentColor}
a.btn:active{transform:scale(.97)}
a:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="tablero" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i class="hueco"></i><i></i><i></i><i></i><i></i><i></i><i></i><span class="suelta"></span></div>
  <p class="k">Error 404</p>
  <h1>Esta pieza<br>no <b>encaja</b></h1>
  <p>La página que buscas no existe o cambió de lugar. El muelle sigue completo.</p>
  <div class="ctas"><a class="btn" href="/modulex-dock/">Volver al inicio</a><a class="btn g" href="tel:+524421247481">Llamar a ventas</a></div>
</main>
</body>
</html>
